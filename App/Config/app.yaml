# APPLICATION CONFIGURATIONS
#==========================================
#=============================================
app:
  app_name: kngell_enterprise
  core_name: Kngell
  app_version: 1.0.0
  core_version: 1.0.0
  app_email: admin@kngell.com
  app_author: Kngell

# GENERAL SETTINGS CONFIGURATIONS
#=============================================================================
#=============================================================================
settings:
  default_charset: UTF-8
  default_locale: fr
  default_timezone: Europe/Paris
  favicon: ""
  apple_icon: ""
  secret_key: ""
  googleAnalytics: UA-XXXXX-Y

# THEME BUILDER CONFIGURATIONS
#=============================================================================
#=============================================================================
theme_builder:
  libraries:
    uikit:
      class: Uikit
      default: true
      version: 1.0
    bootstrap:
      class: Bootstrap
      default: false
      version: 1.0
    tailwind:
      class: Tailwind
      default: false
      version: 1.0

# SESSION CONFIGURATIONS
#=============================================================================
#=============================================================================
session:
  session_name: "kngellSession"
  # idle_time: 600 # 10min idle
  cookie_lifetime: 0 #1600 session expires in 10min if left idle
  path: /
  domain: "localhost"
  cookie_secure: 0
  cookie_httponly: 0
  cookie_samesite:
  gc_maxlifetime: 1440
  gc_probability: 1
  gc_divisor: 100
  use_cookies: 1
  use_only_cookies: 1
  use_trans_sid: 0
  # globalized: true
  default_driver: native_storage
  save_path: session_dir
  save_handler: files
  drivers:
    native_storage:
      class: NativeSessionStorage
      default: true
    array_storage:
      class: ArraySessionStorage
      default: false
    pdo_storage:
      class: PdoSessionStorage

#============================================
# Validation messages - Centralized for both client and server
#============================================
validation:
  # Global validation settings
  settings:
    stop_on_first_error: false
    sanitize_input: true
    validate_all_fields: false
    skip_missing_fields: true
    default_locale: "en"
    fallback_messages: true

  # Core validation messages
  messages:
    # Basic field validators
    required: "%s is required."
    min: "%s must be at least %s characters."
    max: "%s must be at most %s characters."
    pattern: "%s format is invalid."
    numeric: "%s must be a number."
    integer: "%s must be a whole number."
    decimal: "%s must be a decimal number."
    boolean: "%s must be true or false."

    # Number comparisons
    min_value: "%s must be at least %s."
    max_value: "%s must be at most %s."
    lte: "%s must be less than or equal to %s."
    gte: "%s must be greater than or equal to %s."
    lt: "%s must be less than %s."
    gt: "%s must be greater than %s."

    # Conditional validators
    required_if: "%s is required when %s is present."
    required_with: "%s is required when %s is present."
    required_without: "%s is required when %s is not present."

    # Array validators (for variations system)
    array: "%s must be an array."
    max_items: "%s cannot have more than %s items."
    min_items: "%s must have at least %s items."

    # Type validators
    email: "%s must be a valid email address."
    url: "%s must be a valid URL."
    date: "%s must be a valid date."
    datetime: "%s must be a valid date and time."
    time: "%s must be a valid time."

    # File validators
    file: "%s must be a file."
    image: "%s must be an image."
    mimes: "%s must be a file of type: %s."
    max_size: "%s must not be larger than %s kilobytes."

    # String validators
    alpha: "%s must contain only letters."
    alpha_num: "%s must contain only letters and numbers."
    alpha_dash: "%s must contain only letters, numbers, dashes and underscores."

    # Comparison validators
    same: "%s must match %s."
    different: "%s must be different from %s."

    # Custom business rules
    unique: "%s already exists."
    exists: "Selected %s is invalid."
    password_match: "Passwords do not match."
    strong_password: "Password must contain at least one uppercase letter, one lowercase letter, one number, and one special character."

  # Product-specific validation messages (for variations)
  product_messages:
    sku:
      pattern: "SKU can only contain letters, numbers, hyphens, and underscores."
      unique: "This SKU is already in use."
    variations:
      array: "Product variations must be provided as an array."
      max_items: "Cannot have more than %s variations."
    variation_sku:
      pattern: "Variation SKU can only contain letters, numbers, hyphens, and underscores."
      unique: "This variation SKU is already in use."
    price:
      min_value: "Price cannot be negative."
    stock_quantity:
      integer: "Stock quantity must be a whole number."
      min_value: "Stock quantity cannot be negative."
    weight:
      min_value: "Weight cannot be negative."

  # CSS classes for error display
  classes:
    hint:
      - input-box__hint-text
      - invalid-feedback
    error:
      - has-error
      - error-field
    parent_error:
      - has-error
      - error-container
    success:
      - valid-feedback
      - is-valid

  # Validation groups for different scenarios
  groups:
    create:
      - required
      - min
      - max
      - pattern
    update:
      - required
      - min
      - max
    quick:
      - required
    strict:
      - required
      - min
      - max
      - pattern
      - custom

  # Field-specific custom messages
  field_messages:
    email:
      required: "Please enter your email address."
      email: "Please enter a valid email address."
    password:
      required: "Please enter a password."
      min: "Password must be at least 8 characters."
      strong_password: "Password must include uppercase, lowercase, number, and special character."
    variations[][name]:
      required: "Variation name is required."
      min: "Variation name must be at least 1 character."
    variations[][sku]:
      required: "Variation SKU is required."
      pattern: "Variation SKU can only contain letters, numbers, hyphens, and underscores."
    variations[][attributes][][attribute_name]:
      required: "Attribute name is required."
    variations[][attributes][][attribute_value]:
      required: "Attribute value is required."

  # Localization support
  locales:
    en:
      required: "%s is required."
      min: "%s must be at least %s characters."
    fr:
      required: "%s est requis."
      min: "%s doit contenir au moins %s caractères."
    es:
      required: "%s es requerido."
      min: "%s debe tener al menos %s caracteres."

# CACHE CONFIGURATIONS
#================================
#================================
cache:
  cache_name: system_cache
  use_cache: true
  storage: file
  key: auto
  cache_path: /Storage/Cache/
  cache_expires: 3600
  default_driver: native_storage
  drivers:
    native_storage:
      class: NativeCacheStorage
      default: true
    array_storage:
      class: ArrayCacheStorage
      default: false
    pdo_storage:
      class: PdoCacheStorage
      default: false

# SECURITY CONFIGURATIONS
#=============================================================================
#=============================================================================
security:
  password_pattern: '(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{8,}'
  url_pattern: "https?://.+"
  search_pattern: '[^''"]+'
  email_pattern: '[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,}$'
  tel_pattern: "[0-9]{3}-[0-9]{3}-[0-9]{4}"
  random_pass_char: 9
  login_timeout: 30 # This is the period of time the user will be kicked out for
  login_attempts: 3 # 3 incorrect attempts will time the user out for a set period of time
  hash_cost_factor:
    cost: 10
  encript_password: true # password are hash by default. Set to false for the opposit behaviour
  password_algo:
    default: PASSWORD_DEFAULT
    bcrypt: PASSWORD_BCRYPT
    argon2i: PASSWORD_ARGON2I
    argon2id: PASSWORD_ARGON2ID] # other options are [default, bcrypt, argon2i and argon2iD]

# DATABASE CONFIGURATIONS
#=============================================================================
#=============================================================================
database:
  default_driver: "mysql"
  drivers:
    mysql:
      class: MysqlDatabaseConnection
    pgsql:
      class: PgsqlDatabaseConnection
    sqlite:
      class: SqliteDatabaseConnection

# Application debugging. Set the production when the application is ready for production. This is an
# important step as not doing so will expose sensitive information to your frontend users.
debug_error:
  mode: dev

# Custom error handling Which displays a much more descriptive and friendly error within development
# environment. When set to production use the log_path to specify where the exceptions should be
# logged. for later use
error_handler:
  error: ErrorHandling::errorHandle
  exception: ErrorHandling::exceptionHandle
  log_path: ""

logger_handler:
  file: NativeLoggerHandler
  array: ArrayLoggerHandler
  database: PdoLoggerHandler
  console: ConsoleLoggerHandler
  echo: EchoLoggerHandler

# Disallowed controllers prevent the any controller in the array list from being inserted into the database
# this primarily governs the admin panel control menu. As not all controller class is suited to have a
# menu item. If you want a particular controller to not be accessible from the admin menu. You will need to
# list it in the array below
disallowed_controllers:
  - home
  - security
  - password
  - activation
  - registration
  - profile
  - account
  - install
  - accessDenied
  - admin
  - event
  - notification
  - userRole
  - logout

# TEMPLATES CONFIGURATIONS
#=============================================================================
#=============================================================================
activation:
  title: Activate Your Account!
  message: Thanks for registering on kngell_enterprise. Please click the activation button below to activate your account in order to access your profile page.
  call_to_action: Activate Now

password_recovery:
  title: Password Reset Requested
  message: You've requested to reset your password. Please click the link below to reset your password. However if you didn't make this request please click here. Password reset will expire in 30min.
  call_to_action: Reset Password!

token_expired:
  title: Token Expired
  message: Its seem the requested token has expired. Possible reasons could be.
  reasons:
    - The token was already use to reset the password
    - The token has pass the expiration time.
