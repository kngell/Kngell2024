# API routes group
api:
  _group:
    prefix: /api
    middleware: [api]
  /form-validation/{method}:
    controller: Form-validation-api
    httpMethod: get
    responseBody:
      type: JSON
      produces: application/json
    ResponseStatus:
      HttpStatusCode: 200
  /v1/users:
    controller: api
    method: getUsers
    httpMethod: get
  /v1/products:
    controller: api
    method: getProducts
    httpMethod: get
  /v1/orders:
    controller: api
    method: getOrders
    httpMethod: get

# E-commerce routes group
shop:
  _group:
    prefix: /shop
    middleware: [shop]
  /products:
    controller: products
    method: index
    httpMethod: get
  /products/{slug}:
    controller: products
    method: show
    httpMethod: get
  /cart:
    controller: cart
    method: index
    httpMethod: get

# Nested groups example - Admin API
admin_api:
  _group:
    prefix: /admin/api
    middleware: [auth, admin, api]
  /users:
    controller: admin_api
    method: users
    httpMethod: get
  /stats:
    controller: admin_api
    method: stats
    httpMethod: get

