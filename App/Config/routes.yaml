# Admin routes group
admin:
  _group:
    prefix: /admin
    middleware: [auth, admin]
  /dashboard:
    controller: admin
    method: dashboard
    httpMethod: get
  /users:
    controller: admin
    method: users
    httpMethod: get
  /users/{id}:
    controller: admin
    method: userDetail
    httpMethod: get
  /{controller}/{id+}/{method}:
# Dynamic routes can be defined in groups too
admin2:
  _group:
    prefix: /admin
    middleware: [auth, admin]
  /{controller}/index:
    method: index
  /{controller}/show/{id}:
    method: show
  /{controller}/create:
    method: create
    httpMethod: post

/{controller}/{id}/edit:
  method: edit

/{controller}/{method}/{id:\d+}:
  # This will match /products/show/123, /users/edit/456, etc.
/{controller}/{id:\d+}/{method}:

# API routes group
api:
  _group:
    prefix: /api
    middleware: [api]
  /v1/users:
    controller: api
    method: getUsers
    httpMethod: get
  /v1/products:
    controller: api
    method: getProducts
    httpMethod: get
  /v1/orders:
    controller: api
    method: getOrders
    httpMethod: get

# E-commerce routes group
shop:
  _group:
    prefix: /shop
    middleware: [shop]
  /products:
    controller: products
    method: index
    httpMethod: get
  /products/{slug}:
    controller: products
    method: show
    httpMethod: get
  /cart:
    controller: cart
    method: index
    httpMethod: get

# Nested groups example - Admin API
admin_api:
  _group:
    prefix: /admin/api
    middleware: [auth, admin, api]
  /users:
    controller: admin_api
    method: users
    httpMethod: get
  /stats:
    controller: admin_api
    method: stats
    httpMethod: get

# Public routes (no groups)
/:
  controller: home
  method: index
  httpMethod: get

/home:
  controller: home
  method: index
  httpMethod: get

/about:
  controller: home
  method: about
  httpMethod: get

/contact:
  controller: home
  method: contact
  httpMethod: get

# Authentication routes (could be in a group too)
/login:
  controller: login
  method: index
  httpMethod: get

/signup:
  controller: signup
  method: index
  httpMethod: get

/auth-user:
  controller: login
  method: authenticate-user
  httpMethod: post

/{title}/{id:\d+}/{page:\d+}:
  controller: products
  method: showPage
  responseBody:
    type: RAW
    produces: text/xml
  ResponseStatus:
    HttpStatusCode: HTTP_OK
/products/{slug:[\w-]+}:
  controller: products
  method: show
/home/index:
  controller: home
  method: index
  httpMethod: get
  middleware: user
/products:
  controller: products
  method: index
  httpMethod: get
/ecommerce:
  controller: ecommerce
  method: index
  httpMethod: get
/create-payment:
  controller: payments
  method: pay
  httpMethod: post
  middleware: requireLogin

/_404_error:
