# Admin routes group
# Admin routes group
admin:
  _group:
    prefix: /admin
    middleware: [auth, admin]
  /dashboard:
    controller: admin
    method: dashboard
    httpMethod: get
  /users:
    controller: admin
    method: users
    httpMethod: get
  /users/{id}:
    controller: admin
    method: userDetail
    httpMethod: get
  /confirm-product-deletion:
    controller: product-delete
    method: confirm
    httpMethod: post
  /{controller}/index:
    method: index
  /{controller}/show/{id}:
    method: show
  /{controller}/create:
    method: create
    httpMethod: post
  /content-block-page/add/{type}:
    controller: content-block-page
    method: add
    httpMethod: get
  /content-block-page/edit/{type}/{id}:
    controller: content-block-page
    method: edit
    httpMethod: get
  /content-block-page/{id:\d+}/edit/{type}:
    controller: content-block-page
    method: edit
    httpMethod: get
  /content-block-save/index/{type}:
    controller: content-block-save
    method: index
    httpMethod: post
  /content-block-list/index/{type}:
    controller: content-block-list
    method: index
    httpMethod: get

  # ==========================================
  # Dynamic Fallbacks (Keep these at the very bottom!)
  # ==========================================

  # Matches: /admin/posts/42/edit/featured (Where ID must be a number)
  '/{controller}/{id:\d+}/{method}/{type}':
  # Matches: /admin/posts/a1b2c3d4-e5f6/edit (Where ID is a UUID/Hash)
  '/{controller}/{id:[\da-f-]+}/{method}':
  '/{controller}/{method}/{id:[\da-f-]+}':
  # Matches: /admin/posts/42/edit (Where ID must be a number)
  '/{controller}/{id:\d+}/{method}':
  '/{controller}/{method}/{id:\d+}':
  # Matches generic actions: /admin/reports/export
  "/{controller}/{method}":

/{controller}/{id}/edit:
  method: edit

