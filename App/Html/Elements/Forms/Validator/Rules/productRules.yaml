sku:
  display: SKU
  required: true
  min: 3
  max: 64
  pattern: "^[A-Za-z0-9-_]+$"
  unique: ignore_current

name:
  display: Product Name
  required: true
  min: 3
  max: 255

short_description:
  display: Product Short Description
  required_if: status=published
  min: 3

description:
  display: Product Description
  required_if: status=published
  min: 2

base_price:
  display: Base Price
  required_if: name
  numeric: true
  min_value: 0

tax_class_id:
  required_if: price
  display: VAT Class
  numeric: true

compare_price:
  display: Compare Price
  numeric: true
  min_value: 0
  gte: price

cost_price:
  display: Cost Price
  numeric: true
  min_value: 0
  gte: price

base_currency_id:
  display: Base Currency
  required: true
  muneric: true
  min_value: 1

main_image[]:
  display: Main Image
  upload_error: true # Check PHP upload errors first
  required_if: status=published
  file_size: 5M # Application limit: 5MB per image
  upload_limit: 10M # PHP upload_max_filesize: 10MB
  post_limit: 20M # PHP post_max_size: 20MB
  max_files: 1
  mimes: image

